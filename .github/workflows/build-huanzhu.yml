name: Build Huanzhu Board

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main/boards/huanzhu/huanzhu_display.cc'
      - 'main/boards/huanzhu/huanzhu_display.h'
      - '.github/workflows/build-huanzhu.yml'

permissions:
  contents: write

jobs:
  build:
    name: "Build huanzhu-360 (wake word ni hao mo si)"
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 上游 scripts/build.py 的 _wake_word_sdkconfig_options() 只接受
      # ^wn9[sl]_... 这类 WakeNet9 模型，并且无条件注入
      # CONFIG_USE_CUSTOM_WAKE_WORD=n —— 板子 config.json 里写 =y 会被它覆盖。
      # 这里在构建前就地打最小补丁，让 --wake-word custom 合法。
      # 词文本与 MultiNet 模型仍由 main/boards/huanzhu/config.json 提供。
      - name: Patch scripts/build.py to accept --wake-word custom
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import io
          import sys

          PATHNAME = "scripts/build.py"
          ANCHOR = '    if normalized == "disabled":'
          ADDITION = (
              '    if normalized == "custom":\n'
              '        options.extend([\n'
              '            "CONFIG_USE_CUSTOM_WAKE_WORD=y",\n'
              '        ])\n'
              '        return normalized, options, ["CONFIG_USE_CUSTOM_WAKE_WORD"]\n'
              '\n'
          )

          src = io.open(PATHNAME, encoding="utf-8").read()
          if 'if normalized == "custom":' in src:
              print("build.py: already patched")
              sys.exit(0)
          if src.count(ANCHOR) != 1:
              sys.exit("FATAL: anchor count=%d (expected 1); upstream layout changed"
                       % src.count(ANCHOR))
          if "def _wake_word_sdkconfig_options" not in src.split(ANCHOR)[0]:
              sys.exit("FATAL: anchor is not inside _wake_word_sdkconfig_options()")
          io.open(PATHNAME, "w", encoding="utf-8", newline="\n").write(
              src.replace(ANCHOR, ADDITION + ANCHOR, 1))
          print("build.py: patched, --wake-word custom now accepted")
          PYEOF

      # 幻珠圆屏补丁 1/2：字幕条几何。360x360 方形帧缓冲 + 内切圆可见区，
      # 上游把字幕条贴最底边（LV_ALIGN_BOTTOM_MID）且宽 360px——条的两端
      # 落在圆外被面板切黑，单行滚动字幕大部分时间看不见。
      # 修复：把 bottom_bar_ 抬高 35px（-35 offset），标签宽收到 200px，
      # 使 y≈322 处内切圆半宽(~110px) >= 标签半宽(100px)。多行/单行两个分支都改，
      # SetChatMessage 的重对齐同步抬高，幂等（已打过就跳过）。
      - name: Patch lcd_display.cc for round-display subtitle geometry
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import io
          import sys

          PATHNAME = "main/display/lcd_display.cc"
          MARKER = "Huanzhu round display"

          src = io.open(PATHNAME, encoding="utf-8").read()
          if MARKER in src:
              print("lcd_display.cc: already patched")
              sys.exit(0)

          A_MULTILINE = """    lv_obj_set_scrollbar_mode(bottom_bar_, LV_SCROLLBAR_MODE_OFF);
              lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, 0);

              /* chat_message_label_ placed in bottom_bar_, multiline wrapped display */
              chat_message_label_ = lv_label_create(bottom_bar_);
              lv_label_set_text(chat_message_label_, "");
              lv_obj_set_width(chat_message_label_, LV_HOR_RES - lvgl_theme->spacing(8));"""
          N_MULTILINE = """    lv_obj_set_scrollbar_mode(bottom_bar_, LV_SCROLLBAR_MODE_OFF);
              // Huanzhu round display (360x360 inscribed circle): lift the bar above
              // the corner cut-off and narrow the label so text stays in the circle.
              lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, -35);

              /* chat_message_label_ placed in bottom_bar_, multiline wrapped display */
              chat_message_label_ = lv_label_create(bottom_bar_);
              lv_label_set_text(chat_message_label_, "");
              lv_obj_set_width(chat_message_label_, LV_HOR_RES - 160);"""

          A_SINGLE = """    lv_obj_set_scrollbar_mode(bottom_bar_, LV_SCROLLBAR_MODE_OFF);
              lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, 0);

              /* chat_message_label_ placed in bottom_bar_, single-line horizontal scroll */
              chat_message_label_ = lv_label_create(bottom_bar_);
              lv_label_set_text(chat_message_label_, "");
              lv_obj_set_width(chat_message_label_, LV_HOR_RES - lvgl_theme->spacing(8));"""
          N_SINGLE = """    lv_obj_set_scrollbar_mode(bottom_bar_, LV_SCROLLBAR_MODE_OFF);
              // Huanzhu round display (360x360 inscribed circle): lift the bar above
              // the corner cut-off and narrow the label so text stays in the circle.
              lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, -24);

              /* chat_message_label_ placed in bottom_bar_, single-line horizontal scroll */
              chat_message_label_ = lv_label_create(bottom_bar_);
              lv_label_set_text(chat_message_label_, "");
              lv_obj_set_width(chat_message_label_, LV_HOR_RES - 160);"""

          A_REALIGN = """    if (bottom_bar_ != nullptr) {
                  lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, 0);
              }
          #endif"""
          N_REALIGN = """    if (bottom_bar_ != nullptr) {
                  lv_obj_align(bottom_bar_, LV_ALIGN_BOTTOM_MID, 0, -24);
              }
          #endif"""

          n_multi, n_single, n_realign = (src.count(A_MULTILINE), src.count(A_SINGLE),
                                          src.count(A_REALIGN))
          if n_multi != 1 or n_single != 1 or n_realign != 1:
              sys.exit("FATAL: lcd anchors multi=%d single=%d realign=%d (expect 1,1,1)"
                       % (n_multi, n_single, n_realign))
          src = src.replace(A_MULTILINE, N_MULTILINE, 1)
          src = src.replace(A_SINGLE, N_SINGLE, 1)
          src = src.replace(A_REALIGN, N_REALIGN, 1)
          io.open(PATHNAME, "w", encoding="utf-8", newline="\n").write(src)
          print("lcd_display.cc: round-display geometry patched (lift -24px, width 200px)")
          PYEOF

      # 幻珠圆屏补丁 2/2：listening 看门狗。上游在 listening 里收不到服务端
      # STOP/音频（弱信号上行拥塞）时会永远卡在 listening——状态机不回 idle，
      # 没有按键时用户没有任何办法脱困。补丁在主循环 CLOCK_TICK（每秒）里检查：
      # 连续 N 秒仍处于 listening 就关音频通道回 idle（N 可配，默认 20s）。
      - name: Patch application.cc with listening watchdog
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import io
          import sys

          PATHNAME = "main/application.cc"
          MARKER = "Listening watchdog"

          src = io.open(PATHNAME, encoding="utf-8").read()
          if MARKER in src:
              print("application.cc: already patched")
              sys.exit(0)

          # 用正则锚点（对缩进鲁棒）：定位 CLOCK_TICK 块开头，把看门狗插进块体。
          # 幂等靠 MARKER；锚点缺失/多义时 FATAL 停构建。
          import re as _re

          pat = _re.compile(
              r"(if \(bits & MAIN_EVENT_CLOCK_TICK\) \{\n(?:[ \t]*\n)?)([ \t]+clock_ticks_\+\+;\n)"
          )
          matches = list(pat.finditer(src))
          if len(matches) != 1:
              sys.exit("FATAL: CLOCK_TICK anchor matches=%d (expected 1)" % len(matches))
          watchdog = (
              "\n#if CONFIG_WATCHDOG_LISTENING_TIMEOUT\n"
              "            // Huanzhu: if listening gets no server response (uplink congestion,\n"
              "            // weak RSSI), close the channel so the device returns to idle\n"
              "            // instead of being stuck forever. clock_ticks_ resets on every\n"
              "            // state change, so it doubles as a seconds-in-state counter.\n"
              "            if (GetDeviceState() == kDeviceStateListening &&\n"
              "                clock_ticks_ >= CONFIG_WATCHDOG_LISTENING_TIMEOUT_SECONDS) {\n"
              "                ESP_LOGW(TAG, \"Listening watchdog: no server response in %ds, closing channel\",\n"
              "                         CONFIG_WATCHDOG_LISTENING_TIMEOUT_SECONDS);\n"
              "                if (protocol_) {\n"
              "                    protocol_->CloseAudioChannel();\n"
              "                }\n"
              "            }\n"
              "#endif\n"
          )
          mt = matches[0]
          indent = mt.group(2)[: -len(mt.group(2).lstrip())]  # clock_ticks_ 行的缩进
          body = watchdog.replace("\n            ", "\n" + indent)
          src = src[: mt.end(2)] + body + src[mt.end(2):]
          n_tick = src.count("Listening watchdog")
          if n_tick != 1:
              sys.exit("FATAL: watchdog marker count=%d after patch (expected 1)" % n_tick)
          io.open(PATHNAME, "w", encoding="utf-8", newline="\n").write(src)
          print("application.cc: listening watchdog patched")
          PYEOF

      # 看门狗的 Kconfig 符号（WATCHDOG_LISTENING_TIMEOUT / _SECONDS）。
      # 幂等：符号已存在就跳过；锚点变了就报错停构建，避免静默漏配。
      - name: Patch Kconfig.projbuild with watchdog options
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import io
          import sys

          PATHNAME = "main/Kconfig.projbuild"
          MARKER = "WATCHDOG_LISTENING_TIMEOUT"

          src = io.open(PATHNAME, encoding="utf-8").read()
          if MARKER in src:
              print("Kconfig.projbuild: already patched")
              sys.exit(0)

          # 正则锚点：定位 WAKE_WORD_DETECTION_IN_LISTENING 块尾部（default n），
          # 在其后插入两个新符号。对缩进鲁棒；已存在则幂等跳过。
          import re as _re

          pat = _re.compile(
              r'(config WAKE_WORD_DETECTION_IN_LISTENING\n'
              r'[ \t]+bool "Enable Wake Word Detection in Listening Mode"\n'
              r'[ \t]+default n\n)'
          )
          matches = list(pat.finditer(src))
          if len(matches) != 1:
              sys.exit("FATAL: WAKE_WORD_DETECTION_IN_LISTENING anchor matches=%d (expected 1)"
                       % len(matches))
          mt = matches[0]
          insertion = (
              "\n"
              "config WATCHDOG_LISTENING_TIMEOUT\n"
              "    bool \"Auto-recover when stuck in listening (huanzhu watchdog)\"\n"
              "    default y\n"
              "    help\n"
              "        Close the audio channel after N seconds stuck in listening with\n"
              "        no server response, so the device returns to idle instead of\n"
              "        hanging forever.\n"
              "\n"
              "config WATCHDOG_LISTENING_TIMEOUT_SECONDS\n"
              "    int \"Seconds before the listening watchdog fires\"\n"
              "    default 20\n"
              "    range 5 120\n"
          )
          src = src[: mt.end(1)] + insertion + src[mt.end(1):]
          if src.count("config WATCHDOG_LISTENING_TIMEOUT\n") != 1:
              sys.exit("FATAL: watchdog config count wrong after insertion")
          io.open(PATHNAME, "w", encoding="utf-8", newline="\n").write(src)
          print("Kconfig.projbuild: watchdog options added")
          PYEOF

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py huanzhu --name huanzhu-360 --language zh-CN --wake-word custom

      # 打包器（scripts/build_default_assets.py）在没有 MultiNet 符号时会明确报错，
      # 但这里再对成品兜底一次：镜像里必须同时找到命令词文本和 mn*_cn 模型名，
      # 否则唤醒词会静默失效，刷进板子也听不到。
      - name: Verify custom wake word is inside merged binary
        shell: bash
        run: |
          set -e
          F=build/merged-binary.bin
          ls -l "$F"
          # 用 grep -a 而不是 strings：IDF 容器不保证带 binutils
          echo "===== 镜像内找到的语音模型名 ====="
          grep -a -o -E '(wn9[nsl]?_|mn[0-9]+_(cn|en)|vadn_|fst_)[a-z0-9_]{0,24}' "$F" | sort -u | head -30 || echo "(没有)"
          if grep -a -q 'ni hao mo si' "$F"; then
            echo "OK: 自定义唤醒词文本 'ni hao mo si' 已打进 merged 镜像"
          else
            echo "::error::merged 镜像里找不到 'ni hao mo si'，config.json 的 CONFIG_CUSTOM_WAKE_WORD 没生效"
            exit 1
          fi
          if grep -a -q -E 'mn[0-9]+_cn' "$F"; then
            echo "OK: MultiNet 中文模型已打包"
          else
            echo "::error::没有 MultiNet 中文模型 (mn*_cn)，检查 config.json 的 CONFIG_SR_MN_CN_* 符号名"
            exit 1
          fi

      # 万一 MultiNet 符号名对不上（esp-sr 版本差异会改名），把可用符号
      # 直接打印出来，省掉"改一个试一轮十五分钟"的往返。
      - name: List available MultiNet model symbols (diagnostics)
        if: failure()
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          K="managed_components/espressif__esp-sr/Kconfig.projbuild"
          if [ -f "$K" ]; then
            echo "===== 本版本 esp-sr 提供的中文 MultiNet 符号 ====="
            grep -E '^[[:space:]]*config SR_MN_CN' "$K" || echo "(没找到 SR_MN_CN_*)"
            echo "===== 英文 ====="
            grep -E '^[[:space:]]*config SR_MN_EN' "$K" || true
            echo "把上面存在的符号替换掉 config.json 里的 CONFIG_SR_MN_CN_MULTINET6_QUANT 即可"
          else
            echo "$K 不存在，无法列出符号（构建可能在解析依赖前就失败了）"
            ls -d managed_components/* 2>/dev/null || true
          fi
          echo "===== sdkconfig 里实际生效的唤醒词相关项 ====="
          grep -E '^(CONFIG_(USE_(AFE|ESP|CUSTOM)_WAKE_WORD|WAKE_WORD_DISABLED)|CONFIG_CUSTOM_WAKE_WORD|CONFIG_SR_(MN|WN))' sdkconfig 2>/dev/null || echo "(sdkconfig 不存在)"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: huanzhu-360_merged-binary
          path: build/merged-binary.bin
          if-no-files-found: error

      # 同步发一份到 Release：Actions artifact 必须登录才能下载，
      # Release asset 可匿名取回，便于自动校验和烧录。
      - name: Publish firmware to a pre-release
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: huanzhu360-${{ github.run_id }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"tag_name":os.environ["TAG"],"name":"huanzhu-360 CI build "+os.environ["TAG"],"body":"Automatic build: subtitle and top bar fitted into the 360x360 inscribed circle.","prerelease":True}))')
          RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" "${API}/releases")
          UP=$(echo "${RESP}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/merged-binary.bin \
            "${UP}?name=merged-binary.bin" > /dev/null
          echo "FIRMWARE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/merged-binary.bin"
