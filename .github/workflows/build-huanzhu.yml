name: Build Huanzhu Board

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build huanzhu-360
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py huanzhu --name huanzhu-360 --language zh-CN --wake-word nihaoxiaozhi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: huanzhu-360_merged-binary
          path: build/merged-binary.bin
          if-no-files-found: error
